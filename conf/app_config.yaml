    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: localhost
  port: 3306
  user: didilili
  password: dili123
  database: meta

db_dw:
  host: localhost
  port: 3306
  user: didilili
  password: dili123
  database: dw

qdrant:
  host: localhost
  port: 6333
  embedding_size: 1024

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9201
  index_name: data_agent

redis:
  host: localhost
  port: 6379
  db: 0
  # password: null
  # 缓存过期时间（秒）
  ttl: 86400
  # 向量相似度阈值（0.0 ~ 1.0，余弦相似度）
  similarity_threshold: 0.92

llm:
  model_name: deepseek-v4-flash
  api_key: ${oc.env:LLM_API_KEY}
#  base_url: https://api.siliconflow.cn/v1
  base_url: https://api.deepseek.com

sql_safety:
  enabled: true
  # 自动注入的 LIMIT 上限，已有 LIMIT 超过该值会被下调
  max_limit: 1000
  # 查询执行超时（秒）
  query_timeout: 30
  # 显式白名单表名（精确匹配，大小写不敏感），留空则只靠前缀模式
  allowed_tables: []
  # 数仓表名前缀模式，匹配 dim_*/fact_*/dwd_*/dws_* 开头的表
  allowed_table_patterns:
    - "dim_*"
    - "fact_*"
    - "dwd_*"
    - "dws_*"
  # 禁止访问的系统库
  blocked_system_schemas:
    - "information_schema"
    - "mysql"
    - "performance_schema"
    - "sys"
  # 禁止的危险函数（大写存储）
  # 注意 DATABASE() 在 sqlglot 里解析为 CurrentSchema，函数名为 CURRENT_SCHEMA
  blocked_functions:
    - "LOAD_FILE"
    - "SLEEP"
    - "BENCHMARK"
    - "USER"
    - "CURRENT_SCHEMA"
    - "CURRENT_USER"
    - "CONNECTION_ID"
  # correct_sql 最大重试次数
  max_retry_count: 3
