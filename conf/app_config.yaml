  similarity_threshold: 0.92

llm:
  model_name: deepseek-v4-flash
  api_key: ${oc.env:LLM_API_KEY}
#  base_url: https://api.siliconflow.cn/v1
  base_url: https://api.deepseek.com

# 查询结果自然语言总结开关
summary:
  enable: true

session:
  max_sessions: 20
  history_turns: 4
  ttl: 604800
